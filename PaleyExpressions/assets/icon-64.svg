<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">PaleyExpressions icon</title>
  <rect width="64" height="64" rx="10" ry="10" fill="#0f1720" />
  <!-- subtle diagonal stripe for contemporary understated look -->
  <g opacity="0.06" fill="#ffffff">
	<rect x="-16" y="0" width="100" height="12" transform="rotate(-30 32 32)" />
	<rect x="-16" y="16" width="100" height="12" transform="rotate(-30 32 32)" />
  </g>
  <!-- Monogram PE -->
  <g fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="28" text-anchor="middle" dominant-baseline="middle">
	<text x="50%" y="50%" dy="2">PE</text>
  </g>
  <!-- low-contrast border -->
  <rect x="1" y="1" width="62" height="62" rx="9" ry="9" fill="none" stroke="#ffffff" opacity="0.06" />
</svg>